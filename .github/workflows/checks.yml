name: 文档与离线回归

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      ASTRBOT_NATIVE_SOURCE: ${{ github.workspace }}/.native-host/astrbot
      PYTHONPATH: ${{ github.workspace }}/.native-peer
    steps:
      - uses: actions/checkout@v4
      - name: 固定宿主源码，仅编译隔离工具与调度契约
        uses: actions/checkout@v4
        with:
          repository: AstrBotDevs/AstrBot
          ref: 61335414433db721b3f7ecc93f90deafe0a59d78
          path: .native-host
      - name: 固定 LE 源码，验证私聊水位交接
        uses: actions/checkout@v4
        with:
          repository: AKIhunter/astrbot_plugin_livingemotion
          ref: 65f48157c7c23b5799d0a05a1c5838b6881a5ded
          path: .native-peer/astrbot_plugin_livingemotion
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装固定隔离测试依赖
        run: python -m pip install pydantic==2.14.3 jsonschema==4.26.0 PyJWT==2.10.1 starlette==1.10.0 httpx==0.28.1 tenacity==9.2.1 Pillow==13.0.0 aiohttp==3.14.5 mcp==2.3.0
      - name: 文档与资产检查
        run: python -B scripts/check_docs.py
      - name: 独立插件离线回归
        run: python -B run_offline_tests.py
