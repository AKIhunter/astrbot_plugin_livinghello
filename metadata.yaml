name: astrbot_plugin_LivingHello
display_name: LivingHello
short_desc: 让机器人少打扰、会接话，合并碎片消息，减少重复回复和无效调用。
desc: >-
  先判断该不该接话，再结合上下文与图片按人格回复，减少抢话、误回和重复回答。
  支持碎片合并、回复兜底与可视化追踪，兼顾聊天自然度、调用成本和故障排查。
author: AKIhunter
repo: https://github.com/AKIhunter/astrbot_plugin_livinghello
version: 2.10.8
astrbot_version: ">=4.29.1"
# 核心消息链路支持；平台专属功能与验证范围见 README「支持平台」。
support_platforms:
  - aiocqhttp
  - telegram
  - discord
social_link: https://github.com/AKIhunter
tags:
  - 群聊
  - 参与判断
  - 回复兜底
  - WebUI
views:
  - name: guard
    description: 运行概览、判定设置、回复与私聊、流程与试跑
help: >-
  功能：1. 参与适合度判定与硬闸门 2. 碎片消息合并与批次总等待上限
  3. 回复错误统一分类与处置 4. 主模型失败重试、提醒与最后尝试
  5. 私聊水位宽限 6. 独立生图工具与每日额度 7. 四页控制台、快速配置导航与文字试跑
